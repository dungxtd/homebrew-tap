name: Publish release for an app

# Triggered by source app repos via repository_dispatch.
#
# Expected client_payload:
#   app_name:     "<app>" — must match Casks/<app_name>.rb
#   version:      "1.0.3"
#   tag:          "v1.0.3"
#   source_repo:  "<owner>/<app>"
#
# Required secrets:
#   SOURCE_REPO_READ_PAT — Personal Access Token (classic) with `repo` scope
#                          granting read access to private source repos.

on:
  repository_dispatch:
    types: [app-build-finished]
  workflow_dispatch:
    inputs:
      app_name:
        description: App name (must match Casks/<app>.rb)
        required: true
      tag:
        description: Source tag (e.g. v1.0.3)
        required: true
      source_repo:
        description: Source repo (e.g. <owner>/<app>)
        required: true

permissions:
  contents: write

# Every run pushes a cask bump to main; serialize runs (across all apps) so
# concurrent publishes never race on `git push`. Queue, don't cancel.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ github.event.client_payload.app_name || inputs.app_name }}
      TAG:      ${{ github.event.client_payload.tag      || inputs.tag }}
      VERSION:  ${{ github.event.client_payload.version  || inputs.tag }}
      SOURCE_REPO: ${{ github.event.client_payload.source_repo || inputs.source_repo }}
    steps:
      - uses: actions/checkout@v5

      - name: Normalize VERSION (strip leading v)
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Download release assets from source repo
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_READ_PAT }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # Pull build outputs from the source repo's GitHub Release (quota-free)
          # instead of Actions artifacts.
          gh release download "$TAG" --repo "$SOURCE_REPO" --dir artifacts --clobber
          ls -la artifacts

      - name: Fetch release notes from source repo
        env:
          GH_TOKEN: ${{ secrets.SOURCE_REPO_READ_PAT }}
        run: |
          set -euo pipefail
          # The source release body (commit notes written by its release.yml). Kept
          # outside artifacts/ so it is not uploaded as an asset. Falls back to a
          # one-liner for releases that have no notes.
          gh release view "$TAG" --repo "$SOURCE_REPO" --json body --jq .body > "$RUNNER_TEMP/notes.md" || true
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "Release ${TAG} of ${APP_NAME}" > "$RUNNER_TEMP/notes.md"
          fi
          printf '\nSource: https://github.com/%s/releases/tag/%s\n' "$SOURCE_REPO" "$TAG" >> "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - name: Verify artifacts
        run: |
          set -euo pipefail
          if [ -z "$(ls -A artifacts 2>/dev/null)" ]; then
            echo "::error::No assets in source release ${TAG}"
            exit 1
          fi
          ls -la artifacts

      - name: Build latest.json (updater manifest, all platforms)
        run: |
          set -euo pipefail
          VERSIONED_TAG="${APP_NAME}-${TAG}"
          PUB_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSIONED_TAG}"

          PLATFORMS="{}"
          # add "<asset-label>..." <updater platform key> <package pattern>...
          # Takes the first label and pattern with a package that has a .sig
          # beside it.
          add() {
            labels="$1"; key="$2"; shift 2
            pkg=""
            for label in $labels; do
              for ext in "$@"; do
                pkg=$(ls artifacts | grep -iE "^${APP_NAME}_${label}_.*${ext}$" | head -1 || true)
                [ -n "$pkg" ] && [ -f "artifacts/${pkg}.sig" ] && break 2
                pkg=""
              done
            done
            if [ -n "$pkg" ]; then
              body=$(tr -d '\n' < "artifacts/${pkg}.sig")
              PLATFORMS=$(echo "$PLATFORMS" | jq --arg k "$key" --arg sig "$body" --arg url "${PUB_BASE}/${pkg}" \
                '. + {($k): {signature:$sig, url:$url}}')
              echo "latest.json: $key -> $pkg"
            else
              echo "latest.json: $key skipped (no signed updater package)"
            fi
          }
          # macOS: one universal .app.tar.gz serves both architectures (older
          # releases shipped one per architecture).
          add "macos-universal macos-arm64" "darwin-aarch64" '\.app\.tar\.gz'
          add "macos-universal macos-x64"   "darwin-x86_64"  '\.app\.tar\.gz'
          # Windows: the NSIS installer (Tauri v2 signs installers directly, no
          # .zip), MSI as fallback.
          add "windows-x64"   "windows-x86_64"  '-setup\.exe' '\.msi'
          add "windows-arm64" "windows-aarch64" '-setup\.exe' '\.msi'
          # Windows in-place update archive: the app swaps it in without an
          # installer. Extra platform keys, so clients that don't know them keep
          # using the installer keys above.
          add "windows-x64"   "windows-x86_64-inplace"  'update\.zip'
          add "windows-arm64" "windows-aarch64-inplace" 'update\.zip'

          jq -n \
            --arg v "$VERSION" \
            --rawfile notes "$RUNNER_TEMP/notes.md" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{version:$v, notes:$notes, pub_date:$pub_date, platforms:$platforms}' \
            > artifacts/latest.json
          cat artifacts/latest.json

      - name: Create versioned + latest releases, upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSIONED_TAG="${APP_NAME}-${TAG}"
          LATEST_TAG="${APP_NAME}-latest"

          # 1. Versioned (immutable archive)
          if ! gh release view "$VERSIONED_TAG" >/dev/null 2>&1; then
            gh release create "$VERSIONED_TAG" \
              --title "${APP_NAME} ${TAG}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --target main
          else
            # A re-run refreshes the notes (e.g. after the source release was edited).
            gh release edit "$VERSIONED_TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$VERSIONED_TAG" --clobber artifacts/*

          # 2. Moving "latest" release (updater endpoint targets this)
          if gh release view "$LATEST_TAG" >/dev/null 2>&1; then
            for a in $(gh release view "$LATEST_TAG" --json assets --jq '.assets[].name'); do
              gh release delete-asset "$LATEST_TAG" "$a" --yes || true
            done
          else
            gh release create "$LATEST_TAG" \
              --title "${APP_NAME} (latest)" \
              --notes "Moving pointer to most recent ${APP_NAME} release. Updater endpoint: latest.json here." \
              --target main
          fi
          gh release upload "$LATEST_TAG" --clobber artifacts/*

      - name: Bump cask (version + sha256)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CASK="Casks/${APP_NAME}.rb"
          if [ ! -f "$CASK" ]; then
            echo "::warning::no cask file $CASK — skipping bump"
            exit 0
          fi
          # One universal DMG serves both architectures (older releases shipped
          # one per architecture).
          UNIVERSAL_DMG=$(ls artifacts | grep -iE "_macos-universal_.*\.dmg$" | head -1 || true)
          ARM_DMG=$(ls artifacts | grep -iE "_macos-arm64_.*\.dmg$" | head -1 || true)
          INTEL_DMG=$(ls artifacts | grep -iE "_macos-x64_.*\.dmg$" | head -1 || true)
          if [ -n "$UNIVERSAL_DMG" ]; then
            ARM_DMG="$UNIVERSAL_DMG"; INTEL_DMG="$UNIVERSAL_DMG"
          fi
          if [ -z "$ARM_DMG" ] && [ -z "$INTEL_DMG" ]; then
            echo "::error::no macOS DMGs found in artifacts — cannot bump cask sha256"
            exit 1
          fi
          ARM_SHA=""; INTEL_SHA=""
          [ -n "$ARM_DMG" ]   && ARM_SHA=$(shasum -a 256 "artifacts/${ARM_DMG}" | awk '{print $1}')
          [ -n "$INTEL_DMG" ] && INTEL_SHA=$(shasum -a 256 "artifacts/${INTEL_DMG}" | awk '{print $1}')

          # With a universal DMG both blocks point at it, so the url lines are
          # rewritten too (the file name with the version as `#{version}`).
          # Per-arch releases keep the static url lines.
          UNIVERSAL_URL=""
          if [ -n "$UNIVERSAL_DMG" ]; then
            UNIVERSAL_FILE=$(printf '%s' "$UNIVERSAL_DMG" | sed "s/${VERSION}/#{version}/")
            UNIVERSAL_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${APP_NAME}-v#{version}/${UNIVERSAL_FILE}"
          fi

          # Otherwise the urls are static (they interpolate #{version}); only the
          # version line and the per-arch sha256 lines change each release.
          # awk tracks which on_arch block each line belongs to.
          awk -v ver="$VERSION" -v armsha="$ARM_SHA" -v intelsha="$INTEL_SHA" -v url="$UNIVERSAL_URL" '
            /^  version / { print "  version \"" ver "\""; next }
            /on_arm do/   { blk="arm";   print; next }
            /on_intel do/ { blk="intel"; print; next }
            /^    sha256 / {
              if (blk=="arm"   && armsha   != "") { print "    sha256 \"" armsha   "\""; next }
              if (blk=="intel" && intelsha != "") { print "    sha256 \"" intelsha "\""; next }
            }
            /^    url / { if (url != "") { print "    url \"" url "\""; next } }
            { print }
          ' "$CASK" > "$CASK.tmp" && mv "$CASK.tmp" "$CASK"
          cat "$CASK"

          if git diff --quiet "$CASK"; then
            echo "Cask already up-to-date"
            exit 0
          fi
          git config user.email "ci@github.actions"
          git config user.name "release-bot"
          git add "$CASK"
          git commit -m "chore(${APP_NAME}): bump to v${VERSION}"
          git pull --rebase origin main
          git push
